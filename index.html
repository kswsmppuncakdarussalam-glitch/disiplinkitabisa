    <script>
      // Suppress benign WebSocket errors from Vite HMR in cloud sandbox environments
      window.addEventListener('unhandledrejection', function (e) {
        if (e && e.reason && typeof e.reason.message === 'string' && (e.reason.message.includes('WebSocket') || e.reason.message.includes('ws:'))) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        if (e && typeof e.message === 'string' && (e.message.includes('WebSocket') || e.message.includes('ws:'))) {
          e.preventDefault();
        }
      });
    </script>
